<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}SpecTrace AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">◈</span>
    <span class="brand-name">SpecTrace<span class="brand-ai">AI</span></span>
  </a>
  <nav class="topnav">
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Catalog</a>
    <a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' else '' }}">Dashboard</a>
    <a href="/review" class="{{ 'active' if request.url.path == '/review' else '' }}">Review Queue<span id="nav-review-count" class="pill pill-count" hidden>0</span></a>
  </nav>
  <div class="topbar-status">
    <span id="llm-badge" class="badge badge-muted">checking engine…</span>
  </div>
</header>

<main class="shell">
  {% block content %}{% endblock %}
</main>

<footer class="foot">
  <span>SpecTrace AI — Explainable Product Intelligence for Industrial Commerce</span>
  <span class="foot-sep">·</span>
  <span>Every attribute traces to a source or is labeled as inferred.</span>
</footer>

<script src="/static/js/icons.js"></script>
<script src="/static/js/toast.js"></script>
<script src="/static/js/graph.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
